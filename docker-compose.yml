name: ai_interviewer

services:
  # 1. PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Python Backend Server
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: api
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required in .env}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONPATH=/app:/app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app/api
      - ./llm:/app/llm
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React + Vite + Tailwind Frontend SPA
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: app
    container_name: app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
      - BACKEND_PROXY_TARGET=http://api:8000
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
